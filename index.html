<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f97316" />

    <!-- Per-route <title>, description, canonical, Open Graph, Twitter and JSON-LD
         are injected at build time by prerender.mjs (see src/seo/buildHead.js).
         These two defaults are replaced per route and exist only for the dev server. -->
    <title>Copantry — cook what you have before it goes to waste</title>
    <meta
      name="description"
      content="Copantry is a meal planner and pantry tracker that tells you what to cook before food goes to waste and builds your shopping list around what you already have."
    />

    <!-- Fonts: Poppins (logo) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
